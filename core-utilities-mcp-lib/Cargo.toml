[package]
name = "core-utilities-mcp-lib"
version = "0.1.0"
edition = "2021"
authors = ["core-utilities-mcp team"]
description = "Core library for AI-optimized command toolkit (ACI)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
walkdir = "2.0"
regex = "1.0"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.30"
csv = "1.3"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"
proptest = "1"
