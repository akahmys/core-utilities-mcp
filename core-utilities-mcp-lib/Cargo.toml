[package]
name = "core-utilities-mcp-lib"
version = "1.0.0"
edition = "2021"
authors = ["core-utilities-mcp team"]
description = "Core library for AI-optimized command toolkit (ACI)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
walkdir = "2.0"
regex = "1.0"
sysinfo = "0.30"
csv = "1.3"
toml = "0.8"
yaml-rust2 = "0.11"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"
proptest = "1"
