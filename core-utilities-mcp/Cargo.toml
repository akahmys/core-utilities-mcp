[package]
name = "core-utilities-mcp"
version = "1.0.0"
edition = "2021"
authors = ["core-utilities-mcp team"]
description = "MCP server wrapper for core-utilities-mcp-lib"

[dependencies]
core-utilities-mcp-lib = { path = "../core-utilities-mcp-lib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-mcp-schema = "0.10"
