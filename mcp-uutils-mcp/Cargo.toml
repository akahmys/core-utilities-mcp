[package]
name = "mcp-uutils-mcp"
version = "0.1.0"
edition = "2021"
authors = ["mcp-uutils team"]
description = "MCP server wrapper for mcp-uutils-lib"

[dependencies]
mcp-uutils-lib = { path = "../mcp-uutils-lib" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
